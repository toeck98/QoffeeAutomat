# Integration Quality Scale status of QoffeeAutomat (PLAN.md S10, task T507).
#
# Target: all Bronze and Silver rules plus the Gold rules devices, diagnostics,
# discovery, discovery-update-info, dynamic-devices, stale-devices, entity-category,
# entity-device-class, entity-disabled-by-default, entity-translations,
# exception-translations, reconfiguration-flow and repair-issues. The Gold rule
# icon-translations is met as well. Rules outside this list are not targeted and are
# not named here.
#
# Every rule is `done` or `exempt` with a reason. The documentation rules (docs-*) are
# `done`: the user documentation of task T604 (docs/user/, published with MkDocs on
# GitHub Pages) covers them. tests_integration/test_diagnostics.py checks that this
# file stays valid.
rules:
  # -- Bronze ----------------------------------------------------------------------
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The integration does not poll; the agent pushes state over QoffeeLink.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: There are no external Python requirements; aiohttp ships with Home Assistant.
  docs-actions: done # docs/user/commands.md (run a command from Home Assistant), services.yaml
  docs-high-level-description: done # docs/index.md, docs/user/overview.md
  docs-installation-instructions: done # docs/user/install-integration.md
  docs-removal-instructions: done # docs/user/install-integration.md (Remove)
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # -- Silver ----------------------------------------------------------------------
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done # docs/user/wake-on-lan.md (the broadcast address option); host and port are changed by the reconfiguration flow, see docs/user/pairing.md
  docs-installation-parameters: done # docs/user/pairing.md (host, port, pairing code)
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # -- Gold ------------------------------------------------------------------------
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done # docs/user/overview.md (how data flows: the agent pushes changes)
  docs-examples: done # docs/user/commands.md, docs/user/events.md, docs/user/example-mode-start.md
  docs-known-limitations: done # docs/user/install-integration.md (Known limitations)
  docs-supported-devices: done # docs/user/install-windows.md (requirements), docs/user/overview.md
  docs-supported-functions: done # docs/user/overview.md, docs/user/reference/
  docs-troubleshooting: done # docs/user/troubleshooting.md
  docs-use-cases: done # docs/user/quick-start.md, docs/user/example-mode-start.md
  dynamic-devices:
    status: exempt
    comment: One config entry is one PC with exactly one device; there are no sub-devices. Entities are added dynamically from the manifest.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: There is one device per config entry; it is removed with the entry. Stale entities of vanished metrics and commands are removed from the entity registry.
