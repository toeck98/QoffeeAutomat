# Actions of the QoffeeAutomat integration (names and descriptions: strings.json).
#
# Examples for automations. Variable values are sent to the agent as values and
# validated there; they are never pasted into a script, so templates are safe to use.
#
# Run a command with a variable that comes from a template and use the response:
#
#   actions:
#     - action: qoffeeautomat.run_command
#       target:
#         device_id: "{{ device_id('sensor.gaming_pc_power_state') }}"
#       data:
#         command: set_display_profile
#         variables:
#           Profile: "{{ states('input_select.display_profile') }}"
#           UpdateAdapterIds: false
#       response_variable: result
#     - condition: template
#       value_template: "{{ result.exit_code == 0 }}"
#     - action: notify.mobile_app_phone
#       data:
#         message: "{{ result.stdout }}"
#
# Start a long command without waiting for it (the response only has the run id):
#
#   actions:
#     - action: qoffeeautomat.run_command
#       target:
#         device_id: abcdef0123456789abcdef0123456789
#       data:
#         command: backup_documents
#         wait: false
#
# Start the PC in a chosen mode and run the command in one call. Home Assistant sends
# the Wake-on-LAN packets when the PC is not connected, waits until the PC is connected
# and a user session is ready, and then runs the command. After `ready_timeout` seconds
# the action fails with a message that names the missing condition, and runs nothing:
#
#   actions:
#     - action: qoffeeautomat.run_command
#       target:
#         device_id: "{{ device_id('sensor.gaming_pc_power_state') }}"
#       data:
#         command: start_mode
#         variables:
#           Mode: tv
#         wake: true
#         wait_for: session_ready
#         ready_timeout: 240
#
# Show a notification with a picture and two buttons on the desktop of the PC (the agent
# announces the feature notify), and react when a button is pressed. The press is the
# agent event notification_action; `action` is the id of the button, `tag` the tag of the
# notification, so one automation can serve several notifications:
#
#   actions:
#     - action: qoffeeautomat.send_notification
#       target:
#         device_id: "{{ device_id('sensor.gaming_pc_power_state') }}"
#       data:
#         title: Doorbell
#         message: Somebody is at the door.
#         image_url: http://homeassistant.local:8123/local/door.png
#         tag: door
#         actions:
#           - action: open_door
#             title: Open the door
#           - action: ignore
#             title: Ignore
#
#   triggers:
#     - trigger: event
#       event_type: qoffeeautomat_event
#       event_data:
#         type: notification_action
#         data:
#           tag: door
#           action: open_door
#
# React when the PC was started (event entity or bus event):
#
#   triggers:
#     - trigger: event
#       event_type: qoffeeautomat_event
#       event_data:
#         type: booted
#   actions:
#     - action: qoffeeautomat.run_command
#       target:
#         device_id: "{{ trigger.event.data.device_id }}"
#       data:
#         command: set_volume
#         variables:
#           Level: 20

run_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: qoffeeautomat
    command:
      required: true
      example: set_display_profile
      selector:
        text:
    variables:
      example: '{"Profile": "TV-Mode"}'
      selector:
        object:
    wait:
      default: true
      selector:
        boolean:
    timeout:
      default: 60
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          unit_of_measurement: s
          mode: box
    wake:
      default: false
      selector:
        boolean:
    wait_for:
      default: none
      selector:
        select:
          translation_key: wait_for
          options:
            - none
            - connected
            - session_ready
    ready_timeout:
      default: 180
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          unit_of_measurement: s
          mode: box

send_notification:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: qoffeeautomat
    message:
      required: true
      example: Somebody is at the door.
      selector:
        text:
          multiline: true
    title:
      example: Doorbell
      selector:
        text:
    image_url:
      example: http://homeassistant.local:8123/local/door.png
      selector:
        text:
          type: url
    tag:
      example: door
      selector:
        text:
    actions:
      example: '[{"action": "open_door", "title": "Open the door"}]'
      selector:
        object:
