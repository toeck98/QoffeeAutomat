name: ci-protocol

# QoffeeLink schemas and fixtures (PLAN.md S07, S14, task T101).
#
# Validates protocol/schema and protocol/fixtures with scripts/dev/validate_protocol.py,
# which uses only the Python standard library. The .NET and Python conformance tests run
# in ci-dotnet.yml and ci-integration.yml; both also trigger on changes below protocol/.
# Like the other CI workflows it runs on every pull request and push to main and decides
# inside whether there is work (see ci-dotnet.yml for why the filter is not a trigger
# path filter). Require the job `protocol ci passed` in the branch ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol: ${{ steps.filter.outputs.protocol }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PATTERN: '^(protocol/|scripts/dev/validate_protocol\.py$|\.github/workflows/ci-protocol\.yml$)'
        run: |
          set -euo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit: run everything."
            echo "protocol=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq "$PATTERN"; then
            echo "protocol=true" >> "$GITHUB_OUTPUT"
          else
            echo "protocol=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: schemas and fixtures
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate schemas, fixtures and the manifest revision
        run: python scripts/dev/validate_protocol.py

  result:
    name: protocol ci passed
    # Require this job in the branch ruleset: it is green when the validation passed or was
    # skipped because no relevant file changed, and red when anything failed.
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled." >&2
            exit 1
          fi
