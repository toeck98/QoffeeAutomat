name: plan-sync

# Syncs the tasks of docs/plan/tasks.yaml to GitHub issues and to the project board
# (PLAN.md S12, task T010). tasks.yaml stays the source of truth; the script never writes
# to it. Setup (done once by the owner, see docs/maintainers/github-setup.md):
#   * repository variable PLAN_PROJECT_NUMBER: number of the GitHub project (v2)
#   * repository secret PLAN_PROJECT_TOKEN: token with the `project` scope for that project
#     (the workflow token cannot reach user-owned projects)
# Without them the issues are still synced and the project step is skipped.

on:
  push:
    branches: [main]
    paths:
      - docs/plan/tasks.yaml
      - scripts/plan/sync_issues.py
      - .github/workflows/plan-sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the planned changes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: plan-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync plan tasks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Sync issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLAN_PROJECT_NUMBER: ${{ vars.PLAN_PROJECT_NUMBER }}
          PLAN_PROJECT_TOKEN: ${{ secrets.PLAN_PROJECT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/plan/sync_issues.py --dry-run
          else
            python scripts/plan/sync_issues.py
          fi
