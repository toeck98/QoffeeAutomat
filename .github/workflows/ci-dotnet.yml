name: ci-dotnet

# .NET build and test (PLAN.md S12, S14, task T006).
#
# The workflow runs on every pull request and push to main, but the expensive jobs only
# run when files that affect the .NET build changed (the `changes` job decides). Path
# filters on the trigger would leave required status checks pending forever on pull
# requests that touch no matching file, so the filter lives inside the workflow and the
# always-running job `dotnet ci passed` is the one to require in the branch ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dotnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PATTERN: '^(src/|tests/|protocol/|Directory\.Build\.props|Directory\.Packages\.props|global\.json|QoffeeAutomat\.slnx|\.editorconfig|\.gitattributes|\.github/workflows/ci-dotnet\.yml)'
        run: |
          set -euo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit: run everything."
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq "$PATTERN"; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET (version from global.json) with NuGet cache
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
      - name: Restore
        run: dotnet restore
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build with warnings as errors
        run: dotnet build --no-restore --configuration Release -warnaserror
      - name: Test with coverage
        run: >-
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Line coverage on ${RUNNER_OS}"
            echo
            echo "| Coverage report | Line coverage |"
            echo "|---|---|"
            find TestResults -name 'coverage.cobertura.xml' 2>/dev/null | sort | while read -r file; do
              rate="$(grep -o -m1 'line-rate="[0-9.]*"' "$file" | head -n 1 | sed 's/[^0-9.]//g')"
              if [ -n "$rate" ]; then
                percent="$(awk -v r="$rate" 'BEGIN { printf "%.1f%%", r * 100 }')"
              else
                percent="n/a"
              fi
              echo "| \`$(basename "$(dirname "$file")")\` | ${percent} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  result:
    name: dotnet ci passed
    # Require this job in the branch ruleset: it is green when the build passed or was
    # skipped because no relevant file changed, and red when anything failed.
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled." >&2
            exit 1
          fi
