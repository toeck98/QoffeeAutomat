name: release-please

# Release automation, step 1 (PLAN.md S12, S13, task T602).
#
# On every push to main release-please maintains the release pull request (changelog,
# <Version> in Directory.Build.props, version in the integration manifest.json). When that
# pull request is merged it creates the tag and a DRAFT GitHub release (release-please-config.json:
# `draft` and `force-tag-creation`) and this workflow calls release.yml, which builds and attaches
# every asset and publishes the release as its last step. Immutable releases are enabled, so
# nothing can be attached after publication. See docs/maintainers/releasing.md.
#
# Pull requests and tags that are created with the default GITHUB_TOKEN do not start other workflows
# (no CI on the release pull request). Store a fine-grained token or GitHub App token with
# contents and pull requests write access as the secret RELEASE_PLEASE_TOKEN to get CI there;
# without it the default token is used.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  release:
    name: release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The called workflow cannot have more permissions than this job grants.
    permissions:
      # write: the job `winget` of release.yml starts winget.yml with workflow_dispatch (T607).
      actions: write
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
