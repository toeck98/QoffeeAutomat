name: ci-meta

# Repository hygiene (PLAN.md S12, task T008): plan validation, actionlint, workflow
# security lint (zizmor), shell script checks and a markdown link check. The jobs are cheap
# and always run. Require the job `meta ci passed` in the branch ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-meta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate the plan
        run: python scripts/plan/validate.py
      - name: Show the eligible tasks
        run: python scripts/plan/next_task.py --all --ids
      - name: Test the plan tooling
        run: pytest tests/scripts

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The download script is pinned to the commit of release v1.7.12 and installs that
      # exact version. shellcheck is preinstalled on the runner image, so actionlint also
      # checks the shell snippets in the workflows.
      - name: Install actionlint
        run: >-
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          1.7.12
      - name: Lint the workflows
        run: ./actionlint -color

  workflow-security:
    name: workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          set -euo pipefail
          for script in scripts/*/*.sh tests/scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - name: Shellcheck
        run: shellcheck scripts/*/*.sh tests/scripts/*.sh
      - name: Test the repository setup script with a fake gh
        run: bash tests/scripts/test_setup_repo.sh

  links:
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline mode checks links to files in the repository. External links are not
      # checked: they would break the build whenever a remote site is down.
      - name: Check links between files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --exclude-path docs/prototype
            './**/*.md'
          fail: true

  result:
    name: meta ci passed
    # Require this job in the branch ruleset.
    needs: [plan, actionlint, workflow-security, scripts, links]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "A job failed, was cancelled or was skipped." >&2
            exit 1
          fi
