name: release

# Release automation, step 2 (PLAN.md S12, S13, tasks T602 and T603).
#
# Called by release-please.yml after the tag and the draft release exist, or started by hand
# (workflow_dispatch) to build a PRERELEASE from the selected ref (for example v0.2.0-rc.1) or to
# re-run a failed release from the tag. The workflow
#   1. checks the tag and the versions (tag, Directory.Build.props, manifest.json),
#   2. builds the Windows installers and portable zips (x64, arm64) and, when the signing
#      secrets exist, signs the executables and the installers with SignPath (Authenticode),
#      The Linux tarballs and .deb packages (x64, arm64) are built on Ubuntu (T804); they are not signed,
#      the checksums and the attestations (step 4) protect them.
#   3. builds the integration zip for HACS (contents of custom_components/qoffeeautomat at the
#      archive root),
#   4. writes SHA256SUMS.txt and the SPDX SBOM, creates a build provenance attestation for every
#      asset, attaches everything to the DRAFT release, verifies the attestations and the asset list,
#   5. publishes the release as the very last step,
#   6. for a stable release, starts winget.yml for the tag (T607), which submits the new version to winget-pkgs.
# Besides the assets, the workflow builds the hub container image and the Home Assistant app image (T918, D-024):
# jobs hub-images (per architecture, on native runners), hub-manifests (multi-arch tag <version> on GHCR and build
# provenance attestations) and, after the release is published, hub-latest (the tag `latest`, stable releases only).
# The images are not release assets; `publish` waits for hub-manifests so that a release never lacks its images.
# Releases are immutable once published, so a run that fails earlier leaves a draft that can be
# re-run or deleted. See docs/maintainers/releasing.md.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the draft release, for example v1.2.3.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to release, for example v0.2.0-rc.1. A prerelease tag creates a draft prerelease from
          the selected ref. A stable tag only works for an existing draft; run the workflow from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ steps.meta.outputs.sha }}
      release_id: ${{ steps.meta.outputs.release_id }}
      hub_image: ${{ steps.meta.outputs.hub_image }}
      app_image: ${{ steps.meta.outputs.app_image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and the versions, find or create the draft release
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          sha="$(git rev-parse HEAD)"

          # A tag that already exists must point at the commit that is built.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$tag_sha" != "$sha" ]; then
              echo "::error::Tag $TAG points at $tag_sha, but this run builds $sha. Start the workflow from the tag."
              exit 1
            fi
          fi

          # Stable versions must already be in the files (release-please wrote them). A prerelease from a manual
          # run is stamped into the binaries and into the manifest.json of the zip instead.
          props_version="$(sed -n 's|.*<Version>\s*\([^<[:space:]]*\)\s*</Version>.*|\1|p' Directory.Build.props | head -n 1)"
          manifest_version="$(jq -r '.version' custom_components/qoffeeautomat/manifest.json)"
          echo "tag=$TAG props=$props_version manifest=$manifest_version"
          if [ "$prerelease" = "false" ]; then
            if [ "$props_version" != "$version" ] || [ "$manifest_version" != "$version" ]; then
              echo "::error::Directory.Build.props ($props_version) and manifest.json ($manifest_version) must both be $version."
              exit 1
            fi
          fi
          jq -e '.zip_release == true and .filename == "qoffeeautomat.zip"' hacs.json > /dev/null \
            || { echo "::error::hacs.json must set zip_release and filename qoffeeautomat.zip (D-003)."; exit 1; }

          # The hub images (T918, D-024): the container image and the thin image of the Home Assistant app, both on
          # GHCR below the owner of the repository (the registry wants lower case). The app definition names its
          # image and carries the release version (release-please keeps it in step, release-please-config.json).
          owner="$(printf '%s' "$GH_REPO" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          hub_image="ghcr.io/$owner/qoffeeautomat-hub"
          app_image="ghcr.io/$owner/qoffeeautomat-hub-app"
          app_config="packaging/hub/ha-app/config.yaml"
          app_version="$(sed -n 's|^version:[[:space:]]*"\([^"]*\)".*|\1|p' "$app_config" | head -n 1)"
          echo "app=$app_version"
          if [ "$prerelease" = "false" ] && [ "$app_version" != "$version" ]; then
            echo "::error::$app_config ($app_version) must be $version."
            exit 1
          fi
          if ! grep -qx "image: $app_image" "$app_config"; then
            echo "::warning::$app_config does not name the image $app_image; the app of this release is not installable from the repository."
          fi

          # Draft releases are not returned by "releases/tags/<tag>", so list the releases.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")"
          release_id=""
          if [ -n "$existing" ]; then
            if [ "$(printf '%s\n' "$existing" | wc -l)" -ne 1 ]; then
              echo "::error::More than one release uses the tag $TAG."
              exit 1
            fi
            release_id="$(printf '%s' "$existing" | cut -f1)"
            if [ "$(printf '%s' "$existing" | cut -f2)" != "true" ]; then
              echo "::error::Release $TAG is already published. Releases are immutable (PLAN.md S13)."
              exit 1
            fi
            echo "Using the existing draft release $release_id."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$prerelease" = "true" ]; then
            release_id="$(gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$TAG" -f target_commitish="$sha" -f name="QoffeeAutomat $version" \
              -F draft=true -F prerelease=true -F generate_release_notes=true --jq .id)"
            echo "Created the draft prerelease $release_id for $TAG at $sha."
          else
            echo "::error::There is no draft release for $TAG. Stable releases are created by release-please."
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$sha"
            echo "release_id=$release_id"
            echo "hub_image=$hub_image"
            echo "app_image=$app_image"
          } >> "$GITHUB_OUTPUT"

  windows:
    name: windows (${{ matrix.arch }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    # The environment holds the signing secrets and the required reviewer (PLAN.md S12). The reviewer approves
    # the release here, before the build; publishing needs no second approval.
    environment: release
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # Chocolatey package version of Inno Setup; keep it in step with ci-dotnet.yml (job installer).
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # No dependency cache: this workflow produces the released binaries.
      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version "$env:INNO_SETUP_VERSION" --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Code signing (T603, D-020, O-02) runs only when the SignPath credentials exist: the secret
      # SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID of the environment `release`. Without them
      # the release is built unsigned and everything else works the same.
      - name: Check whether code signing is configured
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host 'Code signing is enabled (SignPath).'
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host '::notice::Code signing is not configured (SIGNPATH_API_TOKEN or SIGNPATH_ORGANIZATION_ID missing); this release is unsigned.'
          }

      - name: Publish and stage (agent and SessionHost)
        shell: pwsh
        run: ./packaging/windows/publish.ps1 -Arch $env:ARCH -Version $env:VERSION -SkipZip

      - name: Collect the executables for signing
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $unsigned = "artifacts/signing/unsigned-exe-$env:ARCH"
          New-Item -ItemType Directory -Path $unsigned -Force | Out-Null
          foreach ($name in 'QoffeeAutomat.Agent.exe', 'QoffeeAutomat.SessionHost.exe') {
            Copy-Item -LiteralPath "artifacts/packaging/stage/win-$env:ARCH/$name" -Destination $unsigned
          }
      - name: Upload the unsigned executables
        if: steps.signing.outputs.enabled == 'true'
        id: upload-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-exe-${{ matrix.arch }}
          path: artifacts/signing/unsigned-exe-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
      - name: Sign the executables (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QoffeeAutomat' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_CONFIG_EXECUTABLES || 'executables' }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signing/signed-exe-${{ matrix.arch }}
      - name: Put the signed executables into the staging directory
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
        run: |
          $signedRoot = "artifacts/signing/signed-exe-$env:ARCH"
          $stage = "artifacts/packaging/stage/win-$env:ARCH"
          foreach ($name in 'QoffeeAutomat.Agent.exe', 'QoffeeAutomat.SessionHost.exe') {
            $signed = Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $signed) { throw "SignPath returned no signed $name." }
            Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path $stage $name) -Force
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $stage $name)
            Write-Host "$name : $($signature.Status), $($signature.SignerCertificate.Subject)"
            # The test policy of SignPath uses an untrusted certificate; only the release policy must validate.
            if ($signature.Status -ne 'Valid' -and $env:SIGNING_POLICY -eq 'release-signing') {
              throw "$name has signature status $($signature.Status)."
            }
            if (-not $signature.SignerCertificate) { throw "$name carries no signature." }
          }

      - name: Build the portable zip
        # Same layout as publish.ps1 (a folder QoffeeAutomat-<version>-win-<arch> inside the zip), built here
        # because the executables must be signed before they are zipped.
        shell: pwsh
        run: |
          $rid = "win-$env:ARCH"
          $out = Join-Path $PWD 'artifacts/packaging'
          $name = "QoffeeAutomat-$env:VERSION-$rid"
          $source = Join-Path $out 'zip' $name
          $zip = Join-Path $out "$name.zip"
          if (Test-Path -LiteralPath $source) { Remove-Item -LiteralPath $source -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          Copy-Item -Path (Join-Path $out 'stage' $rid '*') -Destination $source -Recurse -Force
          Copy-Item -LiteralPath 'packaging/windows/README-portable.txt' -Destination (Join-Path $source 'README-portable.txt')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($source, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          Remove-Item -LiteralPath $source -Recurse -Force
          Write-Host "Portable zip: $zip"

      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Arch $env:ARCH -Version $env:VERSION

      - name: Collect the installer for signing
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $unsigned = "artifacts/signing/unsigned-installer-$env:ARCH"
          New-Item -ItemType Directory -Path $unsigned -Force | Out-Null
          Copy-Item -LiteralPath "artifacts/packaging/QoffeeAutomat-Setup-$env:VERSION-$env:ARCH.exe" -Destination $unsigned
      - name: Upload the unsigned installer
        if: steps.signing.outputs.enabled == 'true'
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: artifacts/signing/unsigned-installer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
      - name: Sign the installer (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QoffeeAutomat' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_CONFIG_INSTALLER || 'installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signing/signed-installer-${{ matrix.arch }}
      - name: Put the signed installer into place
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
        run: |
          $name = "QoffeeAutomat-Setup-$env:VERSION-$env:ARCH.exe"
          $signed = Get-ChildItem -LiteralPath "artifacts/signing/signed-installer-$env:ARCH" -Recurse -File -Filter $name | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed $name." }
          $target = Join-Path 'artifacts/packaging' $name
          Copy-Item -LiteralPath $signed.FullName -Destination $target -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "$name : $($signature.Status), $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -and $env:SIGNING_POLICY -eq 'release-signing') {
            throw "$name has signature status $($signature.Status)."
          }
          if (-not $signature.SignerCertificate) { throw "$name carries no signature." }

      - name: Check the version of the binaries
        shell: pwsh
        run: |
          $numeric = ($env:VERSION -split '-')[0]
          $zip = "artifacts/packaging/QoffeeAutomat-$env:VERSION-win-$env:ARCH.zip"
          $installer = "artifacts/packaging/QoffeeAutomat-Setup-$env:VERSION-$env:ARCH.exe"
          foreach ($file in @($zip, $installer)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "$file was not built." }
          }
          foreach ($name in 'QoffeeAutomat.Agent.exe', 'QoffeeAutomat.SessionHost.exe') {
            $info = (Get-Item -LiteralPath "artifacts/packaging/stage/win-$env:ARCH/$name").VersionInfo
            if (-not $info.FileVersion.StartsWith($numeric)) { throw "$name has file version $($info.FileVersion), expected $numeric." }
          }
      - name: Upload the Windows assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            artifacts/packaging/QoffeeAutomat-Setup-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.exe
            artifacts/packaging/QoffeeAutomat-${{ needs.prepare.outputs.version }}-win-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: linux (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # No dependency cache: this workflow produces the released binaries.
      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish and stage
        run: bash packaging/linux/publish.sh --arch "$ARCH" --version "$VERSION"
      - name: Build the tarball and the .deb
        run: |
          set -euo pipefail
          bash packaging/linux/build-tarball.sh --arch "$ARCH" --version "$VERSION"
          bash packaging/linux/build-deb.sh --arch "$ARCH" --version "$VERSION"
      - name: Check the packages
        run: |
          set -euo pipefail
          deb_arch="amd64"
          if [ "$ARCH" = "arm64" ]; then deb_arch="arm64"; fi
          deb_version="$(printf '%s' "$VERSION" | sed 's/-/~/')"
          tarball="artifacts/packaging/QoffeeAutomat-$VERSION-linux-$ARCH.tar.gz"
          deb="artifacts/packaging/qoffeeautomat_${deb_version}_${deb_arch}.deb"
          for file in "$tarball" "$deb"; do
            [ -s "$file" ] || { echo "::error::$file was not built."; exit 1; }
          done
          tar -tzf "$tarball" | grep -q "/app/qoffeeautomat$"
          [ "$(dpkg-deb --field "$deb" Version)" = "$deb_version" ]
          [ "$(dpkg-deb --field "$deb" Architecture)" = "$deb_arch" ]
      - name: Upload the Linux assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            artifacts/packaging/QoffeeAutomat-*-linux-${{ matrix.arch }}.tar.gz
            artifacts/packaging/qoffeeautomat_*_*.deb
          if-no-files-found: error
          retention-days: 7

  integration:
    name: integration zip
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build qoffeeautomat.zip
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/integration"
          mkdir -p "$stage" artifacts
          cp -R custom_components/qoffeeautomat/. "$stage/"
          find "$stage" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$stage" -name '*.pyc' -delete
          # A manual prerelease carries its own version, the files of the repository still hold the last release.
          jq --arg v "$VERSION" '.version = $v' "$stage/manifest.json" > "$stage/manifest.json.tmp"
          mv "$stage/manifest.json.tmp" "$stage/manifest.json"
          [ "$(jq -r '.version' "$stage/manifest.json")" = "$VERSION" ]
          # HACS (zip_release) unpacks the archive into custom_components/qoffeeautomat: no folder inside the zip.
          out="$PWD/artifacts/qoffeeautomat.zip"
          rm -f "$out"
          (cd "$stage" && find . -type f | LC_ALL=C sort | zip -X -q "$out" -@)
          unzip -l "$out"
          unzip -p "$out" manifest.json | jq -e --arg v "$VERSION" '.version == $v and .domain == "qoffeeautomat"'
      - name: Upload the integration zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-integration
          path: artifacts/qoffeeautomat.zip
          if-no-files-found: error
          retention-days: 7

  hub-images:
    name: hub images (${{ matrix.arch }})
    # T918, D-024: the hub container image (packaging/hub/Dockerfile) and the Home Assistant app image
    # (packaging/hub/ha-app/Dockerfile, a layer on the hub image). Each architecture is built on a runner of its own
    # architecture (no emulation), the hub image is smoke-tested (non-root, /data volume, health check) and both
    # images are pushed by digest. The job hub-manifests joins the architectures into the tagged images.
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      HUB_IMAGE: ${{ needs.prepare.outputs.hub_image }}
      APP_IMAGE: ${{ needs.prepare.outputs.app_image }}
      REGISTRY_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Log in to the GitHub container registry
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create the BuildKit builder
        run: docker buildx create --name hub --driver docker-container --use
      - name: Build the hub image for the test
        run: >-
          docker buildx build --builder hub --platform "linux/$ARCH"
          --file packaging/hub/Dockerfile
          --build-arg "VERSION=$VERSION" --build-arg "REVISION=$SHA"
          --tag qoffeeautomat-hub:test --load .
      - name: Test the hub image
        run: bash packaging/hub/test-image.sh qoffeeautomat-hub:test
      - name: Push the hub image by digest
        id: hub
        run: |
          set -euo pipefail
          docker buildx build --builder hub --platform "linux/$ARCH" \
            --file packaging/hub/Dockerfile \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$SHA" \
            --provenance=false --sbom=false \
            --output "type=image,name=$HUB_IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file hub-metadata.json .
          digest="$(jq -r '."containerimage.digest"' hub-metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No image digest in the build metadata."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push the app image by digest
        id: app
        env:
          HUB_DIGEST: ${{ steps.hub.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx build --builder hub --platform "linux/$ARCH" \
            --file packaging/hub/ha-app/Dockerfile \
            --build-arg "BUILD_FROM=$HUB_IMAGE@$HUB_DIGEST" \
            --provenance=false --sbom=false \
            --output "type=image,name=$APP_IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file app-metadata.json packaging/hub/ha-app
          digest="$(jq -r '."containerimage.digest"' app-metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No image digest in the build metadata."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Write the digests
        env:
          HUB_DIGEST: ${{ steps.hub.outputs.digest }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s\n' "$HUB_DIGEST" > "digests/hub-$ARCH"
          printf '%s\n' "$APP_DIGEST" > "digests/app-$ARCH"
      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not "release-*": the job publish downloads every artifact of that name as a release asset.
          name: hub-digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 7

  hub-manifests:
    name: hub images (manifests and attestations)
    needs: [prepare, hub-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REGISTRY_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      HUB_IMAGE: ${{ needs.prepare.outputs.hub_image }}
      APP_IMAGE: ${{ needs.prepare.outputs.app_image }}
    outputs:
      hub_digest: ${{ steps.manifests.outputs.hub_digest }}
      app_digest: ${{ steps.manifests.outputs.app_digest }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hub-digests-*
          merge-multiple: true
          path: digests
      - name: Log in to the GitHub container registry
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create the multi-architecture images
        id: manifests
        run: |
          set -euo pipefail
          for kind in hub app; do
            if [ "$kind" = "hub" ]; then image="$HUB_IMAGE"; else image="$APP_IMAGE"; fi
            refs=()
            for arch in amd64 arm64; do
              digest="$(cat "digests/$kind-$arch")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digests/$kind-$arch is not a digest."; exit 1; }
              refs+=("$image@$digest")
            done
            docker buildx imagetools create --tag "$image:$VERSION" "${refs[@]}"
            index="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No digest for $image:$VERSION."; exit 1; }
            echo "${kind}_digest=$index" >> "$GITHUB_OUTPUT"
            echo "Created $image:$VERSION ($index)"
          done
      - name: Attest the hub image (build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.hub_image }}
          subject-digest: ${{ steps.manifests.outputs.hub_digest }}
          push-to-registry: true
      - name: Attest the app image (build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.app_image }}
          subject-digest: ${{ steps.manifests.outputs.app_digest }}
          push-to-registry: true
      - name: Verify the attestations
        env:
          HUB_DIGEST: ${{ steps.manifests.outputs.hub_digest }}
          APP_DIGEST: ${{ steps.manifests.outputs.app_digest }}
        run: |
          set -euo pipefail
          for ref in "$HUB_IMAGE@$HUB_DIGEST" "$APP_IMAGE@$APP_DIGEST"; do
            ok=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "oci://$ref" --repo "$GH_REPO"; then ok=true; break; fi
              echo "Attestation of $ref not verifiable yet (attempt $attempt)."
              sleep 10
            done
            [ "$ok" = "true" ] || { echo "::error::No valid attestation for $ref."; exit 1; }
          done
          {
            echo "### Hub images $VERSION"
            echo
            echo "* \`$HUB_IMAGE:$VERSION\` (\`$HUB_DIGEST\`)"
            echo "* \`$APP_IMAGE:$VERSION\` (\`$APP_DIGEST\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: attest, attach and publish
    # The hub images are pushed with their version tag before the release is published; `latest` follows after it.
    needs: [prepare, windows, linux, integration, hub-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Download the built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check that every asset is there
        run: |
          set -euo pipefail
          deb_version="$(printf '%s' "$VERSION" | sed 's/-/~/')"
          expected=(
            "QoffeeAutomat-Setup-$VERSION-x64.exe"
            "QoffeeAutomat-Setup-$VERSION-arm64.exe"
            "QoffeeAutomat-$VERSION-win-x64.zip"
            "QoffeeAutomat-$VERSION-win-arm64.zip"
            "QoffeeAutomat-$VERSION-linux-x64.tar.gz"
            "QoffeeAutomat-$VERSION-linux-arm64.tar.gz"
            "qoffeeautomat_${deb_version}_amd64.deb"
            "qoffeeautomat_${deb_version}_arm64.deb"
            "qoffeeautomat.zip"
          )
          for name in "${expected[@]}"; do
            [ -s "dist/$name" ] || { echo "::error::dist/$name is missing or empty."; exit 1; }
          done
          ls -l dist

      - name: Write the SBOM (SPDX)
        # The SPDX document of the GitHub dependency graph (NuGet and pip manifests of the repository, all
        # transitive dependencies GitHub resolves). It describes the repository, not each binary.
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "repos/$GH_REPO/dependency-graph/sbom" --jq '.sbom' > dist/sbom.spdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' dist/sbom.spdx.json > /dev/null
          jq -r '"SBOM: \(.spdxVersion), \(.packages | length) packages"' dist/sbom.spdx.json

      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          # Two spaces between hash and name: "sha256sum -c" accepts the file as it is.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS.txt.tmp
          mv ../SHA256SUMS.txt.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create the build provenance attestations
        # actions/attest creates build provenance when no predicate is given. One attestation per file.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Verify the attestations
        run: |
          set -euo pipefail
          for file in dist/*; do
            ok=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$file" --repo "$GH_REPO"; then ok=true; break; fi
              echo "Attestation of $file not verifiable yet (attempt $attempt)."
              sleep 10
            done
            [ "$ok" = "true" ] || { echo "::error::No valid attestation for $file."; exit 1; }
          done

      - name: Attach the assets to the draft release
        # Assets are uploaded through the REST API with the release id: "gh release upload <tag>" and the
        # tag endpoints do not reliably find draft releases. Assets of an earlier failed run are replaced.
        run: |
          set -euo pipefail
          for id in $(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].id'); do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$id"
          done
          for file in dist/*; do
            name="$(basename "$file")"
            echo "Uploading $name"
            curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$name"
          done

      - name: Check the attached assets
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[] | [.name, .size] | @tsv' | LC_ALL=C sort > attached.tsv
          (cd dist && find . -maxdepth 1 -type f -printf '%f\t%s\n' | LC_ALL=C sort) > local.tsv
          diff -u local.tsv attached.tsv || { echo "::error::The attached assets differ from the built assets."; exit 1; }
          cat attached.tsv

      - name: Publish the release (last step)
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=true
          else
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true
          fi
          {
            echo "### Released $TAG"
            echo
            echo "Prerelease: $PRERELEASE"
            echo
            echo "https://github.com/$GH_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  hub-latest:
    name: move the hub image tag latest
    # Stable releases only, and only after the release is published: `latest` of both hub images then points at the
    # version of this release (the same manifest, so the provenance attestation stays valid). A failure here changes
    # nothing about the published release; run the workflow again from the tag.
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      HUB_IMAGE: ${{ needs.prepare.outputs.hub_image }}
      APP_IMAGE: ${{ needs.prepare.outputs.app_image }}
    steps:
      - name: Log in to the GitHub container registry
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag latest
        run: |
          set -euo pipefail
          for image in "$HUB_IMAGE" "$APP_IMAGE"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done

  winget:
    name: start the winget submission
    # Stable releases only. The release is published already and immutable, so a failure here changes nothing about it;
    # run winget.yml again by hand for the tag (docs/maintainers/winget.md).
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # workflow_dispatch is the one event that the default GITHUB_TOKEN may start; a release published with that token
      # does not start workflows that listen for `release: published`.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Start winget.yml for the tag
        # The workflow file of the tag is used (--ref), so the submission runs the code that was released. A repository
        # without the secret WINGET_TOKEN only gets a warning (require-token=false).
        run: |
          set -euo pipefail
          gh workflow run winget.yml --ref "$TAG" -f tag="$TAG" -f require-token=false
          {
            echo "### winget"
            echo
            echo "Started winget.yml for $TAG. See the run list of the workflow \`winget\`."
          } >> "$GITHUB_STEP_SUMMARY"
