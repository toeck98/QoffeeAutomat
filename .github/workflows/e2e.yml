name: e2e

# End-to-end test with a real Home Assistant (PLAN.md S12, S14, task T508).
#
# Docker compose starts the Home Assistant container with the integration mounted and a
# Linux agent with the simulated or the real Linux platform (tests/e2e/docker-compose.yml); the pytest driver
# in tests/e2e pairs them through the config flow and checks entities, the run_command
# action, command toggling and reconnection after an agent restart.
#
# The second job, `e2e-hub` (PLAN.md S20, task T919), runs the hub scenario in tests/e2e/hub:
# the hub image built from packaging/hub/Dockerfile, two agents with the simulated platform and
# Home Assistant. The driver sets up the hub, enrolls both agents, rolls a profile out to a
# tag, checks stored metrics and the Prometheus export, runs a command through the management
# tunnel and as a fleet action, pairs Home Assistant with the hub, checks `local_config:
# locked` and removes one agent.
#
# Runs every night, on demand, and on pull requests that carry the label `release`. The
# matrix tests the `stable` and the `beta` Home Assistant image. This workflow is not part
# of the required checks of ordinary pull requests.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (Home Assistant ${{ matrix.ha_version }}, ${{ matrix.platform }} platform)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ha_version: [stable, beta]
        # "linux" runs the agent with the real Linux platform instead of --platform simulated (T804).
        platform: [simulated, linux]
    env:
      HA_VERSION: ${{ matrix.ha_version }}
      E2E_AGENT_PLATFORM: ${{ matrix.platform }}
      # Keep the stack running after pytest so that the logs of both containers can be
      # collected on failure; the last step stops it.
      E2E_KEEP_STACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Home Assistant 2026.11 requires Python 3.14.2 or newer.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the compose file
        run: docker compose -f tests/e2e/docker-compose.yml config --quiet
      - name: Run the end-to-end test
        # The hub scenario in tests/e2e/hub has its own stack and its own job below.
        run: pytest tests/e2e --ignore=tests/e2e/hub -v
      - name: Collect the container logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p e2e-logs
          docker compose -f tests/e2e/docker-compose.yml ps --all > e2e-logs/ps.txt 2>&1 || true
          docker compose -f tests/e2e/docker-compose.yml logs --no-color --timestamps agent > e2e-logs/agent.log 2>&1 || true
          docker compose -f tests/e2e/docker-compose.yml logs --no-color --timestamps homeassistant > e2e-logs/homeassistant.log 2>&1 || true
      - name: Upload the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ matrix.ha_version }}-${{ matrix.platform }}
          path: e2e-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down --volumes --remove-orphans

  e2e-hub:
    name: e2e hub (Home Assistant ${{ matrix.ha_version }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ha_version: [stable, beta]
    env:
      HA_VERSION: ${{ matrix.ha_version }}
      # Keep the stack running after pytest so that the logs of all containers can be
      # collected on failure; the last step stops it.
      E2E_KEEP_STACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Home Assistant 2026.11 requires Python 3.14.2 or newer.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the compose file
        run: docker compose -f tests/e2e/hub/docker-compose.yml config --quiet
      - name: Run the hub end-to-end test
        run: pytest tests/e2e/hub -v
      - name: Collect the container logs
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p e2e-hub-logs
          compose=(docker compose -f tests/e2e/hub/docker-compose.yml)
          "${compose[@]}" ps --all > e2e-hub-logs/ps.txt 2>&1 || true
          for service in hub agent1 agent2 homeassistant; do
            "${compose[@]}" logs --no-color --timestamps "$service" > "e2e-hub-logs/${service}.log" 2>&1 || true
          done
      - name: Upload the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-hub-logs-${{ matrix.ha_version }}
          path: e2e-hub-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose -f tests/e2e/hub/docker-compose.yml down --volumes --remove-orphans
