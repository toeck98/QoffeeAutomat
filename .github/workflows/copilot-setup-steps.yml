name: copilot-setup-steps

# Preinstalls the tools that GitHub's coding agent needs (PLAN.md S12, task T011): the .NET
# SDK from global.json, Python with the development dependencies, actionlint and shellcheck.
# The job must be called `copilot-setup-steps`; the workflow also runs when it changes so
# that a broken setup is noticed in the pull request.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore NuGet packages
        run: dotnet restore
      - name: Install Python development dependencies
        run: python -m pip install -r requirements-dev.txt
      # actionlint comes from the download script of the pinned release commit (v1.7.12);
      # shellcheck and PowerShell 7 are part of the runner image.
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) \
            1.7.12 "$HOME/.local/bin"
      - name: Add the tools to the path
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show the installed tool versions
        run: |
          dotnet --version
          python --version
          ruff --version
          mypy --version
          actionlint -version
          shellcheck --version
          pwsh --version
