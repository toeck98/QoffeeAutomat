# User documentation of QoffeeAutomat (PLAN.md S12, task T604).
#
#   python -m pip install -r requirements-docs.txt
#   mkdocs build --strict        # must pass without warnings
#   mkdocs serve                 # local preview
#
# The reference pages docs/user/reference/{metrics,protocol,api}.md are not in the repository: the hook
# scripts/docs/gen_files.py builds them from the sources of truth while the site is built
# (scripts/docs/generate_reference.py).
site_name: QoffeeAutomat
site_description: Monitor a PC from Home Assistant and run your own commands on it.
site_url: https://toeck98.github.io/QoffeeAutomat/
repo_url: https://github.com/toeck98/QoffeeAutomat
repo_name: toeck98/QoffeeAutomat
docs_dir: docs
site_dir: site
strict: true

# Developer and maintainer material stays in the repository and is not part of the site.
exclude_docs: |
  plan/
  prototype/
  adr/
  maintainers/
  security/

theme:
  name: material
  # No Google Fonts: the site loads nothing from other hosts than its own.
  font: false
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/docs/gen_files.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Quick start: user/quick-start.md
      - Overview and architecture: user/overview.md
      - Install on Windows: user/install-windows.md
      - First-run setup: user/first-run.md
      - Pair with Home Assistant: user/pairing.md
      - Install the integration (HACS): user/install-integration.md
      - Verify your download: user/verify-download.md
  - Using QoffeeAutomat:
      - Commands: user/commands.md
      - Sensors: user/sensors.md
      - Events: user/events.md
      - "Example: start the PC in a mode": user/example-mode-start.md
  - Operations:
      - Security model and recommendations: user/security.md
      - Backup and restore: user/backup-restore.md
      - Troubleshooting: user/troubleshooting.md
      - Migration from the prototype: migration-from-prototype.md
  - Reference:
      - Built-in metrics: user/reference/metrics.md
      - Built-in actions: user/reference/actions.md
      - Protocol (QoffeeLink): user/reference/protocol.md
      - Management API: user/reference/api.md
