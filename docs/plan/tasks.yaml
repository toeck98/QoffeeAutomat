# QoffeeAutomat work breakdown. Specification: PLAN.md (same directory).
# Validate with: python scripts/plan/validate.py   (created by T005)
schema_version: 1
project: QoffeeAutomat
spec_file: PLAN.md

# Field reference for every entry in `tasks`:
#   id            T<3 digits>; the first digit is the milestone number
#   title         imperative summary
#   milestone     M0..M9 (see `milestones`)
#   area          list of: repo, ci, github, protocol, contracts, core, agent, api,
#                 windows, sessionhost, ui, integration, packaging, docs, security,
#                 linux, hub
#   size          S (under half a day), M (about a day), L (several days) of agent work
#   actor         agent | human | agent+human
#   platform      any | windows | linux   (where the result must be verified)
#   depends_on    task ids that must be `done` first
#   requirements  requirement ids from PLAN.md S02
#   spec          section ids from PLAN.md that must be read first
#   description   what to build
#   deliverables  paths that must exist afterwards (directories end with /)
#   acceptance    conditions that must all hold
#   verify        shell commands that must succeed (in addition to PLAN.md S14)
#   status        todo | in_progress | blocked | done
# Optional fields:
#   human_verify  true when a check on a real Windows desktop is required
#   detail        epic = placeholder that must first be refined into tasks
#   blocked_reason  text, only with status blocked

status_values: [todo, in_progress, blocked, done]

milestones:
  - id: M0
    title: Foundation
    goal: Clean repository with tooling, CI, agent instructions and GitHub configuration.
    exit_criteria:
      - "All CI workflows run green on an empty skeleton."
      - "AGENTS.md, PLAN.md and tasks.yaml are in the repository and the plan validator passes."
  - id: M1
    title: Protocol and contracts
    goal: QoffeeLink v1 and the config document formats are specified as schemas with fixtures and implemented as C# and Python models.
    exit_criteria:
      - "Every message type has a schema and a fixture; .NET and Python conformance tests pass."
  - id: M2
    title: Agent core
    goal: Cross-platform agent running with the simulated platform; link server, management API and auth work.
    exit_criteria:
      - "A WebSocket client can pair, read the manifest, subscribe to metrics and run a command with variables against the agent on Linux."
  - id: M3
    title: Windows platform
    goal: Windows service, SessionHost, real metrics, built-in commands, prototype features as templates.
    exit_criteria:
      - "The installed service reports the v1 metric set and runs system and user commands on a real Windows PC."
  - id: M4
    title: Web UI
    goal: Blazor UI to monitor the PC, manage and author commands and sensors, pair Home Assistant.
    exit_criteria:
      - "A user can create a PowerShell command with variables, test it and enable it without editing files."
  - id: M5
    title: Home Assistant integration
    goal: Custom integration with config flow, dynamic entities, actions and diagnostics.
    exit_criteria:
      - "The nightly end-to-end test pairs Home Assistant with the agent, sees entities and runs a command with variables."
  - id: M6
    title: Release 1.0
    goal: Installer, release automation, documentation, HACS readiness, security review.
    exit_criteria:
      - "Version 1.0.0 is published with installer, integration zip, checksums, SBOM and attestations."
  - id: M7
    title: Quality of life (1.x)
    goal: Templates, notifications, Wake-on-LAN, updates and other comfort features.
    exit_criteria:
      - "Each feature ships in a minor release with documentation."
  - id: M8
    title: Linux support
    goal: Linux platform, systemd integration and packaging.
    exit_criteria:
      - "The agent installs as a systemd service on Debian or Ubuntu and passes the end-to-end test with real providers."
  - id: M9
    title: Central hub
    goal: Hub with enrollment, configuration roll-out, metric store, management tunnel and fleet link for Home Assistant, shipped as container image and Home Assistant app.
    exit_criteria:
      - "The hub end-to-end test passes: two agents enroll, receive a published profile, report metrics, and Home Assistant controls both through the fleet link."
      - "The hub is released as container image and Home Assistant app with documentation."

tasks:
  # ───────────────────────────── M0 Foundation ─────────────────────────────
  - id: T001
    title: Archive the prototype and reset the repository
    milestone: M0
    area: [repo]
    size: S
    actor: agent
    platform: any
    depends_on: []
    requirements: [R-10]
    spec: [S02, S05]
    description: >-
      Tag the current commit as prototype-v0 so the old service stays reachable, then remove
      QoffeAutomatService/ from main (the folder keeps the prototype's old spelling; everything
      new is spelled QoffeeAutomat, and no other occurrence of the old spelling may remain). Copy the prototype's modes.json and the display logic of
      DisplayModule.cs into docs/prototype/ as reference material for T309. Replace README.md
      with a short stub that states the project is being rebuilt and links to docs/plan/.
      Add PLAN.md and tasks.yaml under docs/plan/ and the placeholder brand files delivered
      with the plan (icon, logo, dark logo, app.ico, README) under assets/brand/. Add the two
      files for the repository setup that were delivered with the plan unchanged:
      scripts/github/setup-repo.sh (executable bit set) and .github/labels.yml.
    deliverables: [docs/plan/PLAN.md, docs/plan/tasks.yaml, docs/prototype/, assets/brand/, scripts/github/setup-repo.sh, .github/labels.yml, README.md]
    acceptance:
      - "Tag prototype-v0 points at the last prototype commit."
      - "No file of the old service remains outside docs/prototype/."
      - "assets/brand/ contains icon.svg, icon.png, icon@2x.png, logo.png, logo@2x.png, dark_logo.png, dark_logo@2x.png and app.ico."
    verify:
      - "git tag --list prototype-v0 | grep -q prototype-v0"
      - "test ! -d QoffeAutomatService"
    status: done

  - id: T002
    title: Create the .NET solution skeleton
    milestone: M0
    area: [repo]
    size: M
    actor: agent
    platform: any
    depends_on: [T001]
    requirements: [R-09]
    spec: [S03, S04, S05, S14]
    description: >-
      Create QoffeeAutomat.slnx with all projects from PLAN.md S04 except Platform.Linux and Hub,
      plus the test projects from S05. Add global.json (latest .NET 10 SDK, rollForward
      latestFeature), Directory.Build.props (net10.0, nullable, implicit usings, warnings as
      errors, analyzers, deterministic builds, Version 0.1.0, MIT metadata),
      Directory.Packages.props (central package management), .editorconfig, .gitattributes and
      a .NET .gitignore. Platform.Windows and SessionHost target net10.0-windows and are
      excluded from the build on non-Windows hosts by a condition so that dotnet build works on
      Linux. Each project contains a placeholder type and each test project one passing test.
    deliverables: [QoffeeAutomat.slnx, global.json, Directory.Build.props, Directory.Packages.props, .editorconfig, src/, tests/]
    acceptance:
      - "dotnet build and dotnet test succeed on Linux and on Windows."
      - "Project references follow S04: Contracts has no project references; Core references Contracts only; Ui.Components does not reference Agent or Core."
    verify:
      - "dotnet build -warnaserror"
      - "dotnet test"
      - "dotnet format --verify-no-changes"
    status: done

  - id: T003
    title: Create the Home Assistant integration skeleton
    milestone: M0
    area: [integration, repo]
    size: S
    actor: agent
    platform: any
    depends_on: [T001]
    requirements: [R-07]
    spec: [S03, S05, S10]
    description: >-
      Create custom_components/qoffeeautomat/ with manifest.json (domain, name, codeowners
      @toeck98, config_flow true, documentation, issue_tracker, integration_type device,
      iot_class local_push, version 0.1.0, zeroconf type, empty requirements), __init__.py,
      const.py, a config_flow.py stub, strings.json and translations/en.json. Add hacs.json at
      the repository root (name, zip_release true, filename qoffeeautomat.zip, homeassistant
      minimum version per D-022 after checking the current stable release). Add pyproject.toml
      with ruff, mypy and pytest configuration, requirements-dev.txt with
      pytest-homeassistant-custom-component, and tests_integration/ with one test that loads
      the manifest.
    deliverables: [custom_components/qoffeeautomat/manifest.json, hacs.json, pyproject.toml, requirements-dev.txt, tests_integration/]
    acceptance:
      - "ruff, mypy and pytest pass."
      - "manifest.json contains every key required by HACS: domain, documentation, issue_tracker, codeowners, name, version."
    verify:
      - "ruff check . && ruff format --check ."
      - "mypy custom_components/qoffeeautomat"
      - "pytest tests_integration"
    status: done

  - id: T004
    title: Add license, community health files and issue forms
    milestone: M0
    area: [github, docs]
    size: S
    actor: agent
    platform: any
    depends_on: [T001]
    requirements: [R-08]
    spec: [S12]
    description: >-
      Add LICENSE (MIT, copyright toeck98), CONTRIBUTING.md (workflow from PLAN.md S01,
      Conventional Commits, how to run checks), CODE_OF_CONDUCT.md (Contributor Covenant),
      SECURITY.md (private vulnerability reporting, supported versions), .github/CODEOWNERS,
      .github/pull_request_template.md (task id, checklist), issue forms bug_report.yml,
      feature_request.yml, template_request.yml and ISSUE_TEMPLATE/config.yml (blank issues
      off, links to Discussions and the security policy).
    deliverables: [LICENSE, CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, .github/CODEOWNERS, .github/pull_request_template.md, .github/ISSUE_TEMPLATE/]
    acceptance:
      - "GitHub's community standards checklist has no open item except those that need repository settings."
      - "All issue forms are valid YAML with required fields for version, OS and Home Assistant version where relevant."
    verify:
      - "python -c \"import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/ISSUE_TEMPLATE/*.yml')]\""
    status: done

  - id: T005
    title: Add agent instructions and plan tooling
    milestone: M0
    area: [repo, docs]
    size: M
    actor: agent
    platform: any
    depends_on: [T001]
    requirements: [R-13]
    spec: [S01, S14]
    description: >-
      Write AGENTS.md: project summary, repository map, the workflow from PLAN.md S01, build
      and test commands, conventions from S14, the rule that Windows-only code is verified in
      CI, and a list of things agents must not do (change decisions silently, add network
      calls to external hosts, embed secrets, bypass parameter binding). Add CLAUDE.md that
      imports AGENTS.md and .github/copilot-instructions.md that points to it. Write
      scripts/plan/validate.py (checks schema of tasks.yaml, unique ids, existing
      dependencies, acyclic graph, milestone and section references against PLAN.md, allowed
      status values, that done tasks only depend on done tasks) and scripts/plan/next_task.py
      (prints the next eligible task as YAML; option --all lists every eligible task for
      parallel work). Both scripts use only PyYAML.
    deliverables: [AGENTS.md, CLAUDE.md, .github/copilot-instructions.md, scripts/plan/validate.py, scripts/plan/next_task.py]
    acceptance:
      - "validate.py exits 0 on the committed plan and non-zero when a dependency id is misspelled (covered by a test)."
      - "next_task.py returns T002 or another dependency-free task while only T001 is done."
    verify:
      - "python scripts/plan/validate.py"
      - "python scripts/plan/next_task.py --all"
    status: done

  - id: T006
    title: Add the .NET CI workflow
    milestone: M0
    area: [ci]
    size: S
    actor: agent
    platform: any
    depends_on: [T002]
    requirements: [R-08]
    spec: [S12, S14]
    description: >-
      Create .github/workflows/ci-dotnet.yml as specified in S12: matrix ubuntu-latest and
      windows-latest, NuGet cache, format check, build with warnings as errors, tests with
      coverage (coverage summary in the job summary, results uploaded as artifact), path
      filters for src/, tests/, protocol/ and build files. Pin all actions by commit SHA with
      the version in a comment. Set least-privilege permissions and a concurrency group that
      cancels superseded runs on pull requests.
    deliverables: [.github/workflows/ci-dotnet.yml]
    acceptance:
      - "The workflow passes on a pull request on both operating systems."
      - "The Windows job builds Platform.Windows and SessionHost and runs Platform.Windows.Tests."
    verify:
      - "actionlint .github/workflows/ci-dotnet.yml"
    status: done

  - id: T007
    title: Add the integration CI workflow
    milestone: M0
    area: [ci, integration]
    size: S
    actor: agent
    platform: any
    depends_on: [T003]
    requirements: [R-08]
    spec: [S12, S14]
    description: >-
      Create .github/workflows/ci-integration.yml: ruff, mypy, pytest with coverage on the
      Python version required by the current Home Assistant release, the hassfest action and
      the HACS validation action (category integration). Path filters for custom_components/,
      tests_integration/, protocol/, hacs.json and Python config files.
    deliverables: [.github/workflows/ci-integration.yml]
    acceptance:
      - "hassfest and HACS validation pass, or the only ignored HACS checks are those that need a published release or repository settings and are listed with a comment."
    verify:
      - "actionlint .github/workflows/ci-integration.yml"
    status: done

  - id: T008
    title: Add security and hygiene workflows
    milestone: M0
    area: [ci, security]
    size: M
    actor: agent
    platform: any
    depends_on: [T006, T007, T005]
    requirements: [R-08]
    spec: [S12]
    description: >-
      Add codeql.yml (csharp, python, actions), dependency-review.yml, scorecard.yml,
      pr-title.yml (Conventional Commit check with the allowed scopes agent, core, contracts,
      protocol, ui, integration, windows, linux, hub, ci, docs, deps, repo), labeler.yml with
      .github/labeler.yml, ci-meta.yml (plan validation, actionlint, workflow security lint,
      markdown link check) and .github/dependabot.yml (nuget, pip, github-actions,
      devcontainers; weekly; grouped minor and patch updates; commit prefix chore(deps)).
    deliverables: [.github/workflows/codeql.yml, .github/workflows/dependency-review.yml, .github/workflows/scorecard.yml, .github/workflows/pr-title.yml, .github/workflows/labeler.yml, .github/workflows/ci-meta.yml, .github/dependabot.yml, .github/labeler.yml]
    acceptance:
      - "All workflows are valid and run on a test pull request."
      - "Every workflow declares explicit permissions and pins actions by SHA."
    verify:
      - "actionlint"
    status: done

  - id: T009
    title: Review the repository setup script and add the required status checks
    milestone: M0
    area: [github]
    size: S
    actor: agent+human
    platform: any
    depends_on: [T004, T008]
    requirements: [R-08]
    spec: [S12, S18]
    description: >-
      scripts/github/setup-repo.sh and .github/labels.yml already exist (added by T001; the
      owner may already have run the script). Do not rewrite the script. Review it against
      the current GitHub REST documentation and correct only what is wrong, in particular:
      the ruleset payloads, the repository role id used by --admin-bypass, the endpoint for
      immutable releases, the environment and deployment policy calls, and the Pages call.
      The script was tested against a simulated gh only, so treat every failure the owner
      reports from a real run as a defect to fix here. Keep the label parser's restricted
      file format and the option interface. Add tests/scripts/test_setup_repo.sh that runs
      the script against a fake gh executable (dry run changes nothing, second run creates
      nothing, required checks are kept when the option is omitted, cleared with
      --clear-required-checks). Determine the exact names of the status checks that the CI
      workflows report on a pull request and write docs/maintainers/github-setup.md with the
      ready-to-copy command including one --required-check option per check, the meaning of
      every step, and the settings that stay manual (discussion categories, project board).
      The owner runs the command (open item O-01) and confirms in the pull request.
    deliverables: [scripts/github/setup-repo.sh, .github/labels.yml, tests/scripts/test_setup_repo.sh, docs/maintainers/github-setup.md]
    acceptance:
      - "shellcheck reports nothing for the script and the fake-gh test passes in ci-meta.yml."
      - "The check names in docs/maintainers/github-setup.md equal the job names that appear on a pull request."
      - "Every area value used in tasks.yaml has a matching area label in .github/labels.yml (checked by scripts/plan/validate.py)."
      - "The owner has confirmed that the script ran against the repository with the required checks."
    verify:
      - "bash -n scripts/github/setup-repo.sh"
      - "shellcheck scripts/github/setup-repo.sh"
      - "bash tests/scripts/test_setup_repo.sh"
    status: done

  - id: T010
    title: Sync plan tasks to GitHub issues and a project board
    milestone: M0
    area: [github, ci]
    size: M
    actor: agent+human
    platform: any
    depends_on: [T005, T009]
    requirements: [R-08, R-13]
    spec: [S01, S12]
    description: >-
      Write scripts/plan/sync_issues.py and .github/workflows/plan-sync.yml. For every task
      the script creates or updates one issue titled with the task id and title, with the
      description, acceptance list as checkboxes, dependencies as issue links, labels task,
      area labels and human where applicable, and the matching milestone (GitHub milestone
      titles have the form id, space, title, for example M0 Foundation). Issues of tasks
      with status done are closed. tasks.yaml stays the source of truth; the script never
      writes to it. Add the issues to a GitHub project whose number is read from a
      repository variable (the owner creates the project once).
    deliverables: [scripts/plan/sync_issues.py, .github/workflows/plan-sync.yml]
    acceptance:
      - "A dry run prints the planned changes without calling the write API."
      - "Running the sync twice creates no duplicate issues (matching by task id in the title)."
    verify:
      - "python scripts/plan/sync_issues.py --dry-run"
    status: done

  - id: T011
    title: Add the devcontainer and coding-agent setup
    milestone: M0
    area: [repo, ci]
    size: S
    actor: agent
    platform: any
    depends_on: [T002, T003]
    requirements: [R-08, R-13]
    spec: [S12]
    description: >-
      Add .devcontainer/devcontainer.json with the .NET 10 SDK, the Python version used by
      Home Assistant, PowerShell 7, actionlint, shellcheck and a post-create step that
      restores NuGet packages and installs requirements-dev.txt. Add
      scripts/dev/run-agent.sh (starts the agent with Platform.Simulated and a temporary data
      directory) and scripts/dev/run-ha.sh (starts a Home Assistant development container
      with custom_components mounted). Add .github/workflows/copilot-setup-steps.yml with the
      same tool installation.
    deliverables: [.devcontainer/devcontainer.json, scripts/dev/run-agent.sh, scripts/dev/run-ha.sh, .github/workflows/copilot-setup-steps.yml]
    acceptance:
      - "Inside the devcontainer all global checks from PLAN.md S14 can be run without further installation."
    verify:
      - "python -c \"import json; json.load(open('.devcontainer/devcontainer.json'))\""
    status: done

  # ─────────────────────── M1 Protocol and contracts ───────────────────────
  - id: T101
    title: Specify QoffeeLink v1 as JSON Schema with fixtures
    milestone: M1
    area: [protocol]
    size: M
    actor: agent
    platform: any
    depends_on: [T005]
    requirements: [R-06, R-07]
    spec: [S06, S07]
    description: >-
      Create protocol/schema/ with one JSON Schema (draft 2020-12) per message type from
      S07, the manifest, the pairing request and response, and a top-level message schema that
      dispatches on the field t. Create protocol/fixtures/ with at least one valid example per
      message type, the full manifest example, and a folder invalid/ with examples that must
      fail validation. Include the optional features arrays of hello and client_hello and the
      optional intervals object of subscribe. Write protocol/README.md with the handshake
      sequence, the state delivery rules, error codes, close codes and the compatibility rules. Add
      scripts/dev/validate_protocol.py and the workflow ci-protocol.yml.
    deliverables: [protocol/schema/, protocol/fixtures/, protocol/README.md, scripts/dev/validate_protocol.py, .github/workflows/ci-protocol.yml]
    acceptance:
      - "Every message type listed in S07 has a schema and at least one valid fixture."
      - "All valid fixtures validate; all fixtures under invalid/ are rejected."
      - "Schemas allow unknown additional properties (forward compatibility) but require the documented mandatory fields."
    verify:
      - "python scripts/dev/validate_protocol.py"
    status: todo

  - id: T102
    title: Implement protocol contracts in C#
    milestone: M1
    area: [contracts]
    size: M
    actor: agent
    platform: any
    depends_on: [T002, T101]
    requirements: [R-06, R-07]
    spec: [S07, S14]
    description: >-
      In QoffeeAutomat.Contracts implement immutable record types for every QoffeeLink message,
      the manifest and the pairing payloads, a polymorphic envelope keyed on t, error code
      constants, and a System.Text.Json source-generation context (snake_case, unknown members
      ignored, unknown message types deserialized to an UnknownMessage type). Add a
      ManifestRevision helper that computes rev as defined in S07 using canonical JSON
      (sorted keys, no insignificant whitespace). Tests load every fixture from protocol/,
      deserialize, serialize and compare semantically, and validate serialized output against
      the schemas.
    deliverables: [src/QoffeeAutomat.Contracts/Link/, tests/QoffeeAutomat.Contracts.Tests/]
    acceptance:
      - "Round trip of every valid fixture is lossless."
      - "No reflection-based serialization is used (trim and AOT analyzers report no warnings for Contracts)."
      - "The rev of the fixture manifest equals the value stored in the fixture."
    verify:
      - "dotnet test tests/QoffeeAutomat.Contracts.Tests"
    status: todo

  - id: T103
    title: Implement config document models and validation
    milestone: M1
    area: [contracts, core]
    size: M
    actor: agent
    platform: any
    depends_on: [T002]
    requirements: [R-03, R-04, R-12]
    spec: [S06]
    description: >-
      In Contracts implement the command document, parameter definition, action variants,
      haControl, custom sensor document, metric override document and agent settings document
      with the common header fields (schemaVersion, revision, updatedAt, origin). runAs has
      the three values system, user and user_elevated. Publish JSON
      Schemas for them under protocol/schema/config/. In Core implement DocumentValidator
      (ids, names, type-specific parameter rules, haControl requirements from the table in
      S06, sequence cycle detection hook) and VariableBinder (validates a variable dictionary
      against the parameter list, applies defaults, converts types, rejects unknown names,
      enforces pattern with match timeout). Both return structured error lists with JSON
      pointer paths.
    deliverables: [src/QoffeeAutomat.Contracts/Config/, src/QoffeeAutomat.Core/Validation/, protocol/schema/config/, tests/QoffeeAutomat.Core.Tests/Validation/]
    acceptance:
      - "The example command document from S06 validates."
      - "Tests cover every row of the parameter table and of the haControl table, including each rejection case."
      - "VariableBinder rejects unknown variables, out-of-range numbers, values not in options and strings over maxLength."
    verify:
      - "dotnet test tests/QoffeeAutomat.Core.Tests --filter Category=Validation"
    status: todo

  - id: T104
    title: Implement protocol models in Python
    milestone: M1
    area: [integration, protocol]
    size: S
    actor: agent
    platform: any
    depends_on: [T003, T101]
    requirements: [R-07]
    spec: [S07, S10]
    description: >-
      Add custom_components/qoffeeautomat/protocol.py with typed models (dataclasses or
      TypedDicts) for hello, manifest, metric and command descriptors, state, event, bye,
      result and error, plus parse functions that tolerate unknown fields and unknown message
      types. No Home Assistant imports in this module. Tests parse every fixture from
      protocol/fixtures/ and check the invalid ones raise a ProtocolError.
    deliverables: [custom_components/qoffeeautomat/protocol.py, tests_integration/test_protocol.py]
    acceptance:
      - "All valid fixtures parse into typed objects; mypy passes in strict mode for the module."
    verify:
      - "pytest tests_integration/test_protocol.py"
      - "mypy custom_components/qoffeeautomat"
    status: todo

  # ───────────────────────────── M2 Agent core ─────────────────────────────
  - id: T201
    title: Bootstrap the agent host
    milestone: M2
    area: [agent]
    size: M
    actor: agent
    platform: any
    depends_on: [T102, T103]
    requirements: [R-01, R-09]
    spec: [S03, S04, S05, S08]
    description: >-
      Build the Agent executable on the ASP.NET Core minimal host. Implement IAppPaths with
      per-OS defaults from S05 and overrides through the option --data-dir and the environment
      variable QOFFEEAUTOMAT_DATA_DIR. Configure the two Kestrel listeners from D-018 (the
      HTTPS listener starts once the certificate from T211 exists; until then only loopback).
      Add structured logging to console and rolling files, the endpoint /healthz, graceful
      shutdown, and a command-line interface with the verbs run (default), version and
      service (stub for T301). Select the platform implementation at start-up: Windows,
      Simulated (option --platform simulated or on unsupported systems), later Linux.
    deliverables: [src/QoffeeAutomat.Agent/Program.cs, src/QoffeeAutomat.Agent/Hosting/, tests/QoffeeAutomat.Agent.Tests/]
    acceptance:
      - "The agent starts on Linux with --platform simulated and answers GET /healthz with 200."
      - "The loopback listener binds to 127.0.0.1 only."
      - "An integration test starts the host through WebApplicationFactory with a temporary data directory."
    verify:
      - "dotnet test tests/QoffeeAutomat.Agent.Tests --filter Category=Hosting"
    status: todo

  - id: T202
    title: Implement the file-based config store
    milestone: M2
    area: [core]
    size: M
    actor: agent
    platform: any
    depends_on: [T103]
    requirements: [R-02, R-03, R-11, R-12]
    spec: [S03, S05, S06, S20]
    description: >-
      Implement IConfigStore in Core for the document kinds command, sensor, metric overrides
      and settings. Features: load and validate all documents at start (invalid files are
      skipped, reported and never deleted), atomic writes (temporary file plus rename),
